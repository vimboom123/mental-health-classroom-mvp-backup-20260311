<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(18, 24, 45, 0.88);
      --panel-border: rgba(255,255,255,0.08);
      --display: #f8fbff;
      --muted: #91a0c7;
      --key: #1b2544;
      --key-2: #24315a;
      --accent: #6ea8fe;
      --accent-2: #8b5cf6;
      --danger: #ef4444;
      --shadow: 0 24px 70px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(110, 168, 254, 0.2), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.18), transparent 28%),
        linear-gradient(180deg, #09101d 0%, #0f172a 100%);
      color: var(--display);
    }

    .calculator {
      width: min(100%, 380px);
      padding: 18px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
    }

    .screen {
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 8px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .expression {
      min-height: 20px;
      text-align: right;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display {
      text-align: right;
      font-size: clamp(2.25rem, 6vw, 3.2rem);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      appearance: none;
      border: 0;
      min-height: 62px;
      border-radius: 18px;
      color: var(--display);
      background: var(--key);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06);
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.98); }
    button:focus-visible {
      outline: 2px solid rgba(110,168,254,0.95);
      outline-offset: 2px;
    }

    .op { background: linear-gradient(180deg, var(--key-2), #263b73); }
    .accent { background: linear-gradient(180deg, var(--accent), #4f7fff); }
    .danger { background: linear-gradient(180deg, #f97373, var(--danger)); }
    .span-2 { grid-column: span 2; }

    .hint {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .calculator { padding: 14px; border-radius: 24px; }
      button { min-height: 58px; border-radius: 16px; }
      .screen { min-height: 98px; padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator app" tabindex="0">
    <div class="topline">
      <span>Calculator</span>
      <span class="badge" id="status">Ready</span>
    </div>

    <section class="screen" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="display" id="display">0</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="danger" data-action="clear">AC</button>
      <button data-action="sign" aria-label="Toggle sign">±</button>
      <button data-action="percent" aria-label="Percent">%</button>
      <button class="op" data-operator="/" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-operator="*" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-operator="-" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-operator="+" aria-label="Add">+</button>

      <button class="span-2" data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="accent" data-action="equals">=</button>
    </section>

    <div class="hint">Keyboard: 0–9, +, -, *, /, Enter, Backspace, Esc, %</div>
  </main>

  <script>
    const display = document.getElementById('display');
    const expression = document.getElementById('expression');
    const statusEl = document.getElementById('status');

    const clearButton = document.querySelector('[data-action="clear"]');

    const state = {
      current: '0',
      stored: null,
      operator: null,
      overwrite: false,
      justEvaluated: false,
      error: false,
      lastOperation: { operator: null, value: null },
    };

    const MAX_LEN = 14;
    const symbols = { '/': '÷', '*': '×', '-': '−', '+': '+' };

    function updateStatus(text = '') {
      statusEl.textContent = text || 'Calculator';
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return 'Error';
      const normalized = Number(value.toPrecision(12));
      const text = String(normalized);
      if (text.length <= MAX_LEN) return text;
      return normalized.toExponential(8).replace(/\.?0+e/, 'e');
    }

    function renderExpression() {
      expression.textContent = state.operator && state.stored !== null
        ? `${state.stored} ${symbols[state.operator] ?? state.operator}`
        : '';
    }

    function render() {
      display.textContent = state.current;
      renderExpression();
      clearButton.textContent = (state.current !== '0' && !state.error && !state.justEvaluated) ? 'CE' : 'AC';
    }

    function normalizeCurrent() {
      if (state.current === '-0' || state.current === '-0.') state.current = '0';
    }

    function resetAll() {
      state.current = '0';
      state.stored = null;
      state.operator = null;
      state.overwrite = false;
      state.justEvaluated = false;
      state.error = false;
      state.lastOperation = { operator: null, value: null };
      updateStatus();
      render();
    }

    function setError() {
      state.current = 'Error';
      state.stored = null;
      state.operator = null;
      state.overwrite = true;
      state.justEvaluated = false;
      state.error = true;
      updateStatus('Error');
      render();
    }

    function inputDigit(digit) {
      if (state.error) resetAll();
      if (state.overwrite || state.current === '0') {
        state.current = digit;
      } else if (state.current === '-0') {
        state.current = `-${digit}`;
      } else if (state.current.replace('-', '').length < MAX_LEN) {
        state.current += digit;
      }
      state.overwrite = false;
      state.justEvaluated = false;
      updateStatus();
      render();
    }

    function inputDecimal() {
      if (state.error) resetAll();
      if (state.overwrite) {
        state.current = '0.';
        state.overwrite = false;
      } else if (!state.current.includes('.')) {
        state.current += '.';
      }
      updateStatus();
      render();
    }

    function toggleSign() {
      if (state.error) return resetAll();
      if (state.current === '0') return;
      state.current = state.current.startsWith('-') ? state.current.slice(1) : `-${state.current}`;
      updateStatus();
      render();
    }

    function toPercent() {
      if (state.error) return resetAll();
      const value = Number(state.current) / 100;
      state.current = formatNumber(value);
      if (state.current === 'Error') return setError();
      state.overwrite = true;
      updateStatus();
      render();
    }

    function clearEntryOrAll() {
      if (state.error) return resetAll();
      if (state.current !== '0' && !state.justEvaluated) {
        state.current = '0';
        state.overwrite = true;
        updateStatus();
        render();
        return;
      }
      calculator.addEventListener('pointerdown', () => calculator.focus());
    resetAll();
    }

    function backspace() {
      if (state.error) return resetAll();
      if (state.overwrite && !state.justEvaluated) return;
      if (state.current.length <= 1 || (state.current.length === 2 && state.current.startsWith('-'))) {
        state.current = '0';
      } else {
        state.current = state.current.slice(0, -1);
      }
      state.justEvaluated = false;
      normalizeCurrent();
      updateStatus();
      render();
    }

    function calculate(a, b, operator) {
      switch (operator) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function commit(operator) {
      if (state.error) return resetAll();
      const currentValue = Number(state.current);
      if (Number.isNaN(currentValue)) return setError();

      if (state.overwrite && state.stored !== null && state.operator) {
        state.operator = operator;
        updateStatus();
        render();
        return;
      }

      if (state.operator && state.stored !== null && !state.overwrite) {
        const result = calculate(state.stored, currentValue, state.operator);
        const formatted = formatNumber(result);
        if (formatted === 'Error') return setError();
        state.current = formatted;
        state.stored = Number(formatted);
      } else if (state.stored === null || state.justEvaluated) {
        state.stored = currentValue;
      }

      state.operator = operator;
      state.overwrite = true;
      state.justEvaluated = false;
      updateStatus();
      render();
    }

    function evaluate() {
      if (state.error) return resetAll();

      let result;
      if (state.justEvaluated && state.lastOperation.operator) {
        const { operator, value } = state.lastOperation;
        result = calculate(Number(state.current), value, operator);
        const formatted = formatNumber(result);
        if (formatted === 'Error') return setError();
        expression.textContent = `${state.current} ${symbols[operator] ?? operator} ${value} =`;
        state.current = formatted;
      } else {
        if (!state.operator || state.stored === null) return;
        const operand = Number(state.current);
        result = calculate(state.stored, operand, state.operator);
        const formatted = formatNumber(result);
        if (formatted === 'Error') return setError();
        expression.textContent = `${state.stored} ${symbols[state.operator] ?? state.operator} ${state.current} =`;
        state.current = formatted;
        state.lastOperation = { operator: state.operator, value: operand };
        state.stored = null;
        state.operator = null;
      }

      state.overwrite = true;
      state.justEvaluated = true;
      updateStatus();
      render();
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      if (button.dataset.digit) return inputDigit(button.dataset.digit);
      if (button.dataset.operator) return commit(button.dataset.operator);

      switch (button.dataset.action) {
        case 'clear': return clearEntryOrAll();
        case 'sign': return toggleSign();
        case 'percent': return toPercent();
        case 'decimal': return inputDecimal();
        case 'equals': return evaluate();
        default: return;
      }
    });

    const calculator = document.querySelector('.calculator');

    calculator.addEventListener('keydown', (event) => {
      const { key } = event;
      if (/^[0-9]$/.test(key)) {
        event.preventDefault();
        return inputDigit(key);
      }
      if (['+', '-', '*', '/'].includes(key)) {
        event.preventDefault();
        return commit(key);
      }
      if (key === '.' || key === ',') {
        event.preventDefault();
        return inputDecimal();
      }
      if (key === '%') {
        event.preventDefault();
        return toPercent();
      }
      if (key === 'Enter' || key === '=') {
        event.preventDefault();
        return evaluate();
      }
      if (key === 'Backspace') {
        event.preventDefault();
        return backspace();
      }
      if (key === 'Escape' || key.toLowerCase() === 'c') {
        event.preventDefault();
        return resetAll();
      }
    });

    calculator.addEventListener('pointerdown', () => calculator.focus());
    resetAll();
  </script>
</body>
</html>
