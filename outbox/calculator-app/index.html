<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-border: rgba(148, 163, 184, 0.18);
      --screen: rgba(15, 23, 42, 0.78);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --num: #1e293b;
      --fn: #334155;
      --op: #f59e0b;
      --eq: #10b981;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 30%),
        linear-gradient(135deg, #020617, #0f172a 45%, #111827);
      color: var(--text);
    }

    .calc {
      width: min(100%, 360px);
      padding: 18px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .screen {
      background: var(--screen);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 20px;
      padding: 16px 18px 14px;
      margin-bottom: 14px;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      overflow: hidden;
    }

    .expr,
    .result {
      width: 100%;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }

    .expr {
      min-height: 24px;
      font-size: 16px;
      color: var(--muted);
    }

    .result {
      min-height: 46px;
      font-size: 40px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 18px;
      height: 62px;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.04s ease, filter 0.15s ease, opacity 0.15s ease;
      background: var(--num);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.98); }
    button:focus-visible {
      outline: 2px solid rgba(96, 165, 250, 0.9);
      outline-offset: 2px;
    }

    .fn { background: var(--fn); }
    .op { background: var(--op); }
    .eq { background: var(--eq); }
    .zero { grid-column: span 2; }

    .hint {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="calc" aria-label="计算器">
    <section class="screen" aria-live="polite">
      <div id="expr" class="expr">&nbsp;</div>
      <div id="result" class="result">0</div>
    </section>

    <section class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="delete">⌫</button>
      <button class="fn" data-action="sign">±</button>
      <button class="op" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="op" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="op" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="op" data-value="+">＋</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="fn" data-action="percent">%</button>
      <button class="eq" data-action="equal">＝</button>
    </section>

    <div class="hint">支持键盘输入 · C / Esc / Delete 清空 · Backspace 删除</div>
  </main>

  <script>
    const exprEl = document.getElementById('expr');
    const resultEl = document.getElementById('result');
    const operators = new Set(['+', '-', '*', '/']);
    const DISPLAY_MAP = { '*': '×', '/': '÷', '-': '−', '+': '+' };
    const MAX_DIGITS = 15;

    let tokens = ['0'];
    let overwriteNumber = false;
    let justEvaluated = false;
    let errorState = false;

    function current() {
      return tokens[tokens.length - 1];
    }

    function setCurrent(value) {
      tokens[tokens.length - 1] = value;
    }

    function isOperator(token) {
      return operators.has(token);
    }

    function formatExpr(list = tokens) {
      if (errorState) return '表达式错误';
      return list.map(token => DISPLAY_MAP[token] || token).join(' ');
    }

    function normalizeNumber(str) {
      if (str === '-0' || str === '') return '0';
      if (!str.includes('.')) return str;
      const trimmed = str.replace(/(\.\d*?[1-9])0+$/u, '$1').replace(/\.0+$/u, '');
      return trimmed === '-0' ? '0' : trimmed;
    }

    function toDisplayNumber(num) {
      if (!Number.isFinite(num)) return 'Error';
      const abs = Math.abs(num);
      if ((abs >= 1e12 || (abs > 0 && abs < 1e-9))) return num.toExponential(6).replace(/\.0+e/u, 'e');
      return normalizeNumber(String(Number(num.toFixed(12))));
    }

    function update() {
      exprEl.textContent = formatExpr() || '\u00A0';
      resultEl.textContent = errorState ? 'Error' : current();
    }

    function resetIfError() {
      if (!errorState) return;
      tokens = ['0'];
      overwriteNumber = false;
      justEvaluated = false;
      errorState = false;
    }

    function inputDigit(digit) {
      resetIfError();
      if (justEvaluated) {
        tokens = ['0'];
        justEvaluated = false;
      }

      const value = current();
      const digitCount = value.replace(/[^0-9]/g, '').length;
      if (!overwriteNumber && digitCount >= MAX_DIGITS) return;
      if (overwriteNumber) {
        setCurrent(digit);
        overwriteNumber = false;
      } else if (value === '0') {
        setCurrent(digit);
      } else if (value === '-0') {
        setCurrent('-' + digit);
      } else {
        setCurrent(value + digit);
      }
      update();
    }

    function inputDecimal() {
      resetIfError();
      if (justEvaluated) {
        tokens = ['0'];
        justEvaluated = false;
      }

      if (overwriteNumber) {
        setCurrent('0.');
        overwriteNumber = false;
        update();
        return;
      }

      const value = current();
      if (!value.includes('.')) setCurrent(value + '.');
      update();
    }

    function inputOperator(op) {
      resetIfError();
      if (overwriteNumber && tokens.length > 1) {
        tokens[tokens.length - 2] = op;
      } else {
        if (justEvaluated) justEvaluated = false;
        tokens.push(op, '0');
        overwriteNumber = true;
      }
      update();
    }

    function clearAll() {
      tokens = ['0'];
      overwriteNumber = false;
      justEvaluated = false;
      errorState = false;
      update();
    }

    function backspace() {
      if (errorState || justEvaluated) return clearAll();
      if (overwriteNumber) {
        if (tokens.length > 1) {
          tokens.splice(-2, 2);
          overwriteNumber = false;
          update();
          return;
        }
        overwriteNumber = false;
      }
      const value = current();
      if (value.length <= 1 || (value.length === 2 && value.startsWith('-'))) {
        setCurrent('0');
      } else {
        setCurrent(value.slice(0, -1));
      }
      update();
    }

    function toggleSign() {
      resetIfError();
      justEvaluated = false;
      const value = current();
      setCurrent(value.startsWith('-') ? value.slice(1) : '-' + value);
      overwriteNumber = false;
      update();
    }

    function percent() {
      resetIfError();
      justEvaluated = false;
      const value = Number(current());
      if (!Number.isFinite(value)) {
        errorState = true;
      } else {
        let nextValue = value / 100;
        if (tokens.length >= 3 && isOperator(tokens[tokens.length - 2])) {
          const baseValue = Number(tokens[tokens.length - 3]);
          const operator = tokens[tokens.length - 2];
          if (Number.isFinite(baseValue) && (operator === '+' || operator === '-')) {
            nextValue = (baseValue * value) / 100;
          }
        }
        setCurrent(toDisplayNumber(nextValue));
        overwriteNumber = false;
      }
      update();
    }

    function precedence(op) {
      return op === '+' || op === '-' ? 1 : 2;
    }

    function applyOp(a, b, op) {
      if (op === '+') return a + b;
      if (op === '-') return a - b;
      if (op === '*') return a * b;
      if (op === '/') {
        if (b === 0) return NaN;
        return a / b;
      }
      return NaN;
    }

    function evaluateTokens(list) {
      const values = [];
      const ops = [];

      function reduce() {
        const op = ops.pop();
        const b = values.pop();
        const a = values.pop();
        const result = applyOp(a, b, op);
        if (!Number.isFinite(result)) throw new Error('bad math');
        values.push(result);
      }

      for (const token of list) {
        if (isOperator(token)) {
          while (ops.length && precedence(ops[ops.length - 1]) >= precedence(token)) reduce();
          ops.push(token);
        } else {
          const value = Number(token);
          if (!Number.isFinite(value)) throw new Error('bad number');
          values.push(value);
        }
      }

      while (ops.length) reduce();
      if (values.length !== 1) throw new Error('bad expression');
      return values[0];
    }

    function calculate() {
      resetIfError();
      const expr = overwriteNumber && tokens.length > 1 ? tokens.slice(0, -2) : tokens.slice();
      if (!expr.length) return clearAll();

      try {
        const result = evaluateTokens(expr);
        const displayResult = toDisplayNumber(result);
        exprEl.textContent = formatExpr(expr) + ' =';
        resultEl.textContent = displayResult;
        tokens = [displayResult];
        overwriteNumber = false;
        justEvaluated = true;
        errorState = false;
      } catch {
        errorState = true;
        overwriteNumber = false;
        justEvaluated = false;
        update();
      }
    }

    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const { value, action } = button.dataset;

      if (value && /^\d$/u.test(value)) return inputDigit(value);
      if (value === '.') return inputDecimal();
      if (value && operators.has(value)) return inputOperator(value);
      if (action === 'clear') return clearAll();
      if (action === 'delete') return backspace();
      if (action === 'sign') return toggleSign();
      if (action === 'percent') return percent();
      if (action === 'equal') return calculate();
    });

    function isEditableTarget(target) {
      return Boolean(
        target &&
        (
          target.isContentEditable ||
          (typeof target.closest === 'function' && target.closest('input, textarea, select, [contenteditable="true"]'))
        )
      );
    }

    function keyboardAction(key) {
      if (/^\d$/u.test(key)) return () => inputDigit(key);
      if (key === '.') return () => inputDecimal();
      if (operators.has(key)) return () => inputOperator(key);
      if (key === 'x' || key === 'X') return () => inputOperator('*');
      if (key === 'Enter' || key === '=') return () => calculate();
      if (key === 'Backspace') return () => backspace();
      if (key === 'Delete' || key === 'Escape' || key.toLowerCase() === 'c') return () => clearAll();
      if (key === '%' || key.toLowerCase() === 'p') return () => percent();
      if (key.toLowerCase() === 's') return () => toggleSign();
      return null;
    }

    window.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (isEditableTarget(event.target)) return;
      if (
        typeof event.target?.closest === 'function' &&
        event.target.closest('button') &&
        (event.key === 'Enter' || event.key === ' ')
      ) {
        return;
      }

      const action = keyboardAction(event.key);
      if (!action) return;
      event.preventDefault();
      action();
    });

    update();
  </script>
</body>
</html>
